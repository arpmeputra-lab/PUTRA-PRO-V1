name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan proyek Android dari index.html
        run: |
          set -e
          test -f index.html || { echo "index.html tidak ada di root repo"; exit 1; }
          mkdir -p app/src/main/assets app/src/main/java/com/putra/pro app/src/main/res/values app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26
          cp index.html app/src/main/assets/index.html
          cat > settings.gradle <<'PUTRA_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PutraPro"
          include ':app'
          PUTRA_EOF
          cat > build.gradle <<'PUTRA_EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          PUTRA_EOF
          cat > gradle.properties <<'PUTRA_EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          PUTRA_EOF
          cat > app/build.gradle <<'PUTRA_EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.putra.pro'
              compileSdk 34

              defaultConfig {
                  applicationId "com.putra.pro"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          PUTRA_EOF
          cat > app/src/main/AndroidManifest.xml <<'PUTRA_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="PUTRA PRO"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|keyboard|screenLayout|smallestScreenSize|uiMode"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

              </application>

          </manifest>
          PUTRA_EOF
          cat > app/src/main/res/values/colors.xml <<'PUTRA_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="app_bg">#0B1424</color>
              <color name="ic_bg">#0B1424</color>
          </resources>
          PUTRA_EOF
          cat > app/src/main/res/values/styles.xml <<'PUTRA_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.DeviceDefault.NoActionBar">
                  <item name="android:windowBackground">@color/app_bg</item>
                  <item name="android:statusBarColor">@color/app_bg</item>
                  <item name="android:navigationBarColor">@color/app_bg</item>
              </style>
          </resources>
          PUTRA_EOF
          cat > app/src/main/res/drawable/ic_launcher_foreground.xml <<'PUTRA_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#2F9BFF"
                  android:pathData="M54,26 L60,48 L82,54 L60,60 L54,82 L48,60 L26,54 L48,48 Z" />
          </vector>
          PUTRA_EOF
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'PUTRA_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          PUTRA_EOF
          cat > app/src/main/java/com/putra/pro/MainActivity.java <<'PUTRA_EOF'
          package com.putra.pro;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.util.Base64;
          import android.view.ViewGroup;
          import android.webkit.JavascriptInterface;
          import android.webkit.JsPromptResult;
          import android.webkit.JsResult;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.EditText;
          import android.widget.Toast;

          import java.io.IOException;
          import java.io.OutputStream;

          public class MainActivity extends Activity {

              private static final int REQ_FILE = 1001;
              private static final int REQ_SAVE = 1002;
              private static final String START_URL = "file:///android_asset/index.html";

              private WebView web;
              private ValueCallback<Uri[]> filePathCallback;
              private byte[] pendingBytes;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  web = new WebView(this);
                  web.setLayoutParams(new ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT));
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setSupportZoom(false);
                  s.setBuiltInZoomControls(false);
                  s.setTextZoom(100);

                  web.addJavascriptInterface(new Bridge(), "PutraAndroid");

                  web.setWebViewClient(new WebViewClient() {
                      @SuppressWarnings("deprecation")
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          if (url == null) return true;
                          if (url.startsWith("file:///android_asset/")
                                  || url.startsWith("about:")
                                  || url.startsWith("blob:")
                                  || url.startsWith("data:")
                                  || url.startsWith("javascript:")) {
                              return false;
                          }
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                          } catch (Exception e) {
                              toast("Tidak bisa membuka tautan");
                          }
                          return true;
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {

                      @Override
                      public boolean onJsAlert(WebView view, String url, String message, final JsResult result) {
                          if (isFinishing()) {
                              result.cancel();
                              return true;
                          }
                          new AlertDialog.Builder(MainActivity.this)
                                  .setMessage(message)
                                  .setCancelable(false)
                                  .setPositiveButton(android.R.string.ok, (d, w) -> result.confirm())
                                  .show();
                          return true;
                      }

                      @Override
                      public boolean onJsConfirm(WebView view, String url, String message, final JsResult result) {
                          if (isFinishing()) {
                              result.cancel();
                              return true;
                          }
                          new AlertDialog.Builder(MainActivity.this)
                                  .setMessage(message)
                                  .setCancelable(false)
                                  .setPositiveButton(android.R.string.ok, (d, w) -> result.confirm())
                                  .setNegativeButton(android.R.string.cancel, (d, w) -> result.cancel())
                                  .show();
                          return true;
                      }

                      @Override
                      public boolean onJsPrompt(WebView view, String url, String message, String defaultValue, final JsPromptResult result) {
                          if (isFinishing()) {
                              result.cancel();
                              return true;
                          }
                          final EditText input = new EditText(MainActivity.this);
                          if (defaultValue != null) input.setText(defaultValue);
                          new AlertDialog.Builder(MainActivity.this)
                                  .setMessage(message)
                                  .setView(input)
                                  .setCancelable(false)
                                  .setPositiveButton(android.R.string.ok, (d, w) -> result.confirm(input.getText().toString()))
                                  .setNegativeButton(android.R.string.cancel, (d, w) -> result.cancel())
                                  .show();
                          return true;
                      }

                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (filePathCallback != null) {
                              filePathCallback.onReceiveValue(null);
                              filePathCallback = null;
                          }
                          filePathCallback = callback;

                          Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType(pickType(params == null ? null : params.getAcceptTypes()));
                          if (params != null && params.getMode() == FileChooserParams.MODE_OPEN_MULTIPLE) {
                              intent.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                          }
                          try {
                              startActivityForResult(Intent.createChooser(intent, "Pilih file"), REQ_FILE);
                          } catch (Exception e) {
                              filePathCallback = null;
                              callback.onReceiveValue(null);
                              toast("Tidak bisa membuka pemilih file");
                          }
                          return true;
                      }
                  });

                  web.loadUrl(START_URL);
              }

              private static String pickType(String[] accept) {
                  if (accept == null || accept.length == 0) return "*/*";
                  boolean allImages = true;
                  boolean any = false;
                  for (String a : accept) {
                      if (a == null || a.trim().isEmpty()) continue;
                      any = true;
                      if (!a.trim().startsWith("image/")) allImages = false;
                  }
                  return (any && allImages) ? "image/*" : "*/*";
              }

              private void toast(final String msg) {
                  runOnUiThread(() -> Toast.makeText(MainActivity.this, msg, Toast.LENGTH_LONG).show());
              }

              private static String cleanName(String name) {
                  String n = name == null ? "" : name.replaceAll("[\\\\/:*?\"<>|]", "_").trim();
                  return n.isEmpty() ? "PUTRA_PRO.zip" : n;
              }

              private static String mimeFor(String name) {
                  String l = name.toLowerCase();
                  if (l.endsWith(".zip")) return "application/zip";
                  if (l.endsWith(".txt")) return "text/plain";
                  if (l.endsWith(".html")) return "text/html";
                  if (l.endsWith(".json")) return "application/json";
                  return "application/octet-stream";
              }

              private class Bridge {

                  @JavascriptInterface
                  public void copy(final String text) {
                      runOnUiThread(() -> {
                          ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                          if (cm != null) {
                              cm.setPrimaryClip(ClipData.newPlainText("PUTRA PRO", text == null ? "" : text));
                          }
                      });
                  }

                  @JavascriptInterface
                  public void saveBase64(String filename, String base64) {
                      try {
                          final byte[] bytes = Base64.decode(base64 == null ? "" : base64, Base64.DEFAULT);
                          final String name = cleanName(filename);
                          runOnUiThread(() -> {
                              pendingBytes = bytes;
                              Intent i = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                              i.addCategory(Intent.CATEGORY_OPENABLE);
                              i.setType(mimeFor(name));
                              i.putExtra(Intent.EXTRA_TITLE, name);
                              try {
                                  startActivityForResult(i, REQ_SAVE);
                              } catch (Exception e) {
                                  pendingBytes = null;
                                  toast("Tidak bisa membuka penyimpanan");
                              }
                          });
                      } catch (Exception e) {
                          toast("Gagal menyiapkan file");
                      }
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);

                  if (requestCode == REQ_FILE) {
                      if (filePathCallback != null) {
                          Uri[] results = null;
                          if (resultCode == RESULT_OK && data != null) {
                              results = WebChromeClient.FileChooserParams.parseResult(resultCode, data);
                          }
                          filePathCallback.onReceiveValue(results);
                          filePathCallback = null;
                      }
                  } else if (requestCode == REQ_SAVE) {
                      byte[] bytes = pendingBytes;
                      pendingBytes = null;
                      if (resultCode == RESULT_OK && data != null && data.getData() != null && bytes != null) {
                          try (OutputStream os = getContentResolver().openOutputStream(data.getData(), "wt")) {
                              if (os == null) throw new IOException("stream null");
                              os.write(bytes);
                              os.flush();
                              toast("File tersimpan");
                          } catch (Exception e) {
                              toast("Gagal menyimpan: " + e.getMessage());
                          }
                      } else {
                          toast("Penyimpanan dibatalkan");
                      }
                  }
              }

              @Override
              public void onBackPressed() {
                  if (web != null && web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  if (web != null) web.onPause();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (web != null) web.onResume();
              }

              @Override
              protected void onDestroy() {
                  if (filePathCallback != null) {
                      filePathCallback.onReceiveValue(null);
                      filePathCallback = null;
                  }
                  if (web != null) {
                      web.destroy();
                      web = null;
                  }
                  super.onDestroy();
              }
          }
          PUTRA_EOF

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Ganti nama APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PUTRA-PRO.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PUTRA-PRO-APK
          path: PUTRA-PRO.apk

      - name: Buat Release (link download langsung)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: PUTRA PRO v1.${{ github.run_number }}
          files: PUTRA-PRO.apk
